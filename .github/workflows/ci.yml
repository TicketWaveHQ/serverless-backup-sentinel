name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the offline tests
        run: python -W default -m unittest discover -s tests -v

  docs:
    name: No em-dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject em-dashes in any tracked file
        run: |
          python3 - <<'EOF'
          import pathlib, subprocess, sys
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          bad = []
          for name in files:
              text = pathlib.Path(name).read_text(encoding="utf-8", errors="replace")
              bad += ["%s:%d" % (name, n) for n, line in enumerate(text.splitlines(), 1) if chr(0x2014) in line]
          print("\n".join(bad) or "none found")
          sys.exit(1 if bad else 0)
          EOF
